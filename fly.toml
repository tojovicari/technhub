app            = "cto-ai-api"
primary_region = "gru"

[env]
  PORT                        = "3000"
  NODE_ENV                    = "production"
  FRONTEND_URL                = "https://app.moasy.tech"
  PUBLIC_API_URL              = "https://api.moasy.tech"
  GITHUB_OAUTH_CALLBACK_URL   = "https://api.moasy.tech/auth/github/callback"
  GOOGLE_OAUTH_CALLBACK_URL   = "https://api.moasy.tech/auth/google/callback"
  MICROSOFT_OAUTH_CALLBACK_URL = "https://api.moasy.tech/auth/microsoft/callback"
  SLACK_OAUTH_CALLBACK_URL   = "https://api.moasy.tech/auth/slack/callback"
  # IDs de canal, não segredo (o Bot Token que autentica é secret, ver
  # docs/deploy-flyio.md) — Slack App à parte do "Sign in with Slack" acima.
  SLACK_OPS_FEEDBACK_CHANNEL_ID = "C0BR8LF7AG2"
  SLACK_OPS_BILLING_CHANNEL_ID  = "C0BR2ED0CE7"
  AUTH_DEFAULT_LOGIN_PROVIDER = "github"
  NOTIFICATION_EMAIL_PROVIDER = "resend"
  # Sem isso explícito, cada máquina do app cai no default do código (20,
  # ver src/database/pool.ts) — com as 2 máquinas do app, até 40 conexões
  # simultâneas contra um banco que já foi derrubado por OOM numa instância
  # pequena (ver incidente investigado nesta sessão). 10 por máquina = 20 no
  # total, cabe com folga no 1GB novo do cto-ai-db.
  DATABASE_POOL_MAX = "10"

[deploy]
  release_command = "npm run migrate"
  # Blue-green foi tentado nesta sessão pra evitar a janela de 500 logo após
  # deploy (rolling derruba as duas máquinas quase ao mesmo tempo) — revertido
  # porque a conta não tem memória sobrando pra rodar máquinas antigas+novas
  # em paralelo (deploy falhou: "insufficient memory available to fulfill
  # request" ao tentar subir a machine do release_command). Rolling de volta;
  # a proteção real contra a janela de 500 agora é o /health checar o
  # Postgres de verdade + o boot esperar a primeira conexão (server.ts) —
  # não depende de estratégia de deploy pra funcionar.

[http_service]
  internal_port         = 3000
  force_https           = true
  auto_stop_machines    = true
  auto_start_machines   = true
  min_machines_running  = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 500
    soft_limit = 400

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.health]
    grace_period  = "15s"
    interval      = "15s"
    method        = "GET"
    path          = "/health"
    port          = 3000
    timeout       = "5s"
    type          = "http"
    restart_limit = 3
