name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency: deploy-production
    # Sem isso, o GitHub nunca cria um Deployment de verdade (API
    # `/repos/{repo}/deployments`) — é o único jeito de um job "avisar" o
    # GitHub que essa execução representa um deploy, e é exatamente o que o
    # conector `github_actions` (`GitHubActionsProvider`) lê pra alimentar
    # Deployment Frequency. `fly deploy` sozinho não cria isso. O nome
    # "production" já bate com o fallback padrão de classificação de
    # ambiente (`system-default-rules.ts`), então não precisa de config
    # adicional pra isso contar como PRODUCTION.
    environment: production

    steps:
      - uses: actions/checkout@v7

      # `superfly/flyctl-actions/setup-flyctl@master` parou de exportar o
      # PATH corretamente pro passo seguinte ("fly: command not found" logo
      # depois de "Added flyctl to the path", visto ao vivo — falha herdada
      # do technhub, não é regressão daqui). Instala direto via script
      # oficial em vez de depender do addPath da action de terceiros.
      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Deploy
        run: fly deploy --remote-only --app cto-ai-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
