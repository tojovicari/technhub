name: Sync

on:
  # Cron desligado de propósito — o disparo automático de /internal/sync
  # processa toda integração ACTIVE de todo tenant ACTIVE num Promise.all só,
  # e o pool de conexões do Postgres não tem `max` configurado (default da
  # lib `pg` é 10) — não escala além de poucos tenants sem ajuste antes. Ver
  # docs/BACKLOG.md. Pra reativar, descomente o bloco `schedule` abaixo.
  # schedule:
  #   - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    name: Trigger scheduled sync
    runs-on: ubuntu-latest
    # Evita rodar 2 execuções em paralelo se uma demorar mais que o intervalo do cron.
    concurrency: scheduled-sync

    steps:
      - name: POST /internal/sync
        run: |
          curl -sf -X POST https://api.moasy.tech/internal/sync \
            -H "X-Internal-Token: ${{ secrets.INTERNAL_SYNC_TOKEN }}"
