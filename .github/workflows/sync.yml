name: Sync

on:
  schedule:
    # 1x/dia por enquanto (06:00 UTC) — GitHub Actions não garante o horário
    # exato sob carga, é um "pelo menos 1x/dia". Era */10 min; reduzido de
    # propósito enquanto o volume de integrações ativas não justifica mais
    # frequência. Fácil de aumentar de novo depois, é só trocar o cron.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    name: Trigger scheduled sync
    runs-on: ubuntu-latest
    # Evita rodar 2 execuções em paralelo se uma demorar mais que o intervalo do cron.
    concurrency: scheduled-sync

    steps:
      - name: POST /internal/sync
        run: |
          curl -sf -X POST https://api.moasy.tech/internal/sync \
            -H "X-Internal-Token: ${{ secrets.INTERNAL_SYNC_TOKEN }}"
